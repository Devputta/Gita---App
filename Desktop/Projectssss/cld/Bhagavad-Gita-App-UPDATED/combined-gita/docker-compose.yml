services:
  postgres:
    image: postgres:16
    container_name: bhagavad-gita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhagavad_gita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bhagavad_gita_pgdata:/var/lib/postgresql/data

volumes:
  bhagavad_gita_pgdata:
